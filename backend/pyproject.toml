[project]
name = "backend"
version = "0.1.0"
description = "TripPatch backend: minimal-perturbation trip recovery engine"
authors = [
    { name = "kyurimyang", email = "kyurim1006@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "openai>=3.51.0",
    "pydantic>=2.14.1",
    "pyjwt[crypto]>=2.15.1",
    "python-dotenv>=1.2.4",
    "supabase>=2.34.1",
    "tzdata>=2026.6",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "black>=26.10.1",
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-m 'not live and not slow and not db'"
markers = [
    "live: tests that call real external APIs",
    "slow: long property tests, run with pytest -m slow",
    "db: tests against the dev Supabase project (.env), run with pytest -m db",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.black]
# Same as ruff: black defaulted to 88 and wanted to rewrap 73 files ruff already accepts.
line-length = 100
target-version = ["py312"]
